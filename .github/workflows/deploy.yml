name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build
        env:
          VITE_SUPABASE_URL: https://vxmjsgbpfmofbcpetgjd.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_6UXinSjJvtv2GrDPcxjGWQ_coi53JU5'
        run: |
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add the VITE_SUPABASE_PUBLISHABLE_KEY Actions secret before deploying the Supabase-connected site."
            exit 1
          fi
          npm run build
      - name: Verify compiled output
        shell: bash
        run: |
          grep -q 'src="/PetCocha-Premium_ReactSpa/assets/.*\.js"' dist/index.html
          grep -q 'href="/PetCocha-Premium_ReactSpa/assets/.*\.css"' dist/index.html
          if grep -q '/src/main.jsx' dist/index.html; then
            echo "Development entry point found in dist/index.html" >&2
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
